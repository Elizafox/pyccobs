[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyccobs"
version = "0.1.0"
description = "Portable ctypes bindings for ccobs"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE", "vendor/ccobs/LICENSE"]
authors = [{ name = "Elizabeth Kiara Regina Ashford" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.cibuildwheel]
# ctypes wheels are independent of the Python ABI; build once per platform.
build = ["cp311-manylinux_*", "cp311-macosx_*", "cp311-win_amd64", "cp311-win_arm64"]
archs = ["native"]
before-build = 'python -m pip install "cmake>=3.15"'
test-requires = ["pytest>=7"]
test-sources = ["tests"]
test-command = "python -m pytest tests"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
