name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-sdist:
    name: Lint and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install build ruff twine
      - name: Lint
        run: ruff check .
      - name: Build and check source distribution
        run: |
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test tools
        run: python -m pip install build pytest
      - name: Build wheel
        run: python -m build --wheel
      - name: Install built wheel
        run: python -m pip install --no-index --find-links=dist pyccobs
      - name: Test installed wheel
        run: python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
